<svg version="1.1" width="1000" height="800" viewBox="0 0 8000 6400"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">True Surfing movement options</title>
  <desc id="desc">A red enemy on the left has fired a bullet. A small orange arc near it is the bullet wave now, and a
    large dashed orange arc is the same wave when it reaches the blue bot on the right. From the blue bot, a green path
    curves upward to a green dot on the arriving wave, labeled forward with low danger. A red path curves downward to a
    red dot, labeled reverse with high danger, and it reaches less far because the bot must brake first. A dashed
    orange ring around the blue bot marks the stop option with medium danger.</desc>

  <style>
    .text { font: 150px sans-serif; }
    .small { font: 120px sans-serif; }
    .bold { font-weight: bold; }
  </style>

  <rect x="0" y="0" width="8000" height="6400" fill="grey"/>
  <rect x="200" y="200" width="7600" height="6000" fill="#111"/>
  <clipPath id="field-wsi"><rect x="200" y="200" width="7600" height="6000"/></clipPath>

  <g clip-path="url(#field-wsi)">
    <!-- Wave now (turn 5) and on arrival (turn 35) -->
    <path d="M 1480 2715 A 560 560 0 0 1 1480 3685" stroke="#F59E0B" stroke-width="40" fill="none"/>
    <path d="M 4270.3 623.7 A 4008 4008 0 0 1 4270.3 5776.3" stroke="#F59E0B" stroke-width="30"
          stroke-dasharray="120 80" fill="none"/>
    <!-- Simulated paths -->
    <polyline points="5200,3200 5200,3160 5200,3112 5198,3056 5196,2992 5193,2928 5188,2864 5183,2801 5177,2737 5169,2673 5161,2610 5151,2547 5141,2483 5129,2420 5117,2358 5103,2295 5089,2233 5074,2171 5057,2109 5040,2047 5021,1986 5002,1925 4982,1864 4960,1804 4938,1744 4915,1684 4891,1625 4865,1566 4839,1508 4812,1450 4785,1392" stroke="#10B981" stroke-width="40" fill="none"/>
    <polyline points="5200,3200 5200,3184 5200,3184 5200,3192 5200,3208 5200,3232 5200,3264 5199,3304 5198,3352 5196,3408 5192,3472 5188,3536 5183,3599 5176,3663 5169,3727 5160,3790 5151,3853 5141,3917 5129,3980 5117,4042 5103,4105 5089,4167 5073,4229 5057,4291 5039,4353 5021,4414 5002,4475 4981,4536 4960,4596 4938,4656 4915,4716" stroke="#EF4444" stroke-width="40" fill="none"/>
    <!-- Intercept spots -->
    <circle cx="4785" cy="1392" r="90" fill="#10B981"/>
    <circle cx="4915" cy="4716" r="90" fill="#EF4444"/>
    <circle cx="5200" cy="3200" r="330" fill="none" stroke="#F59E0B" stroke-width="30" stroke-dasharray="60 40"/>
  </g>

  <!-- Bots -->
  <use href="#tank" transform="translate(960, 2960) scale(0.6)"
       style="--tank-body-color:#c00; --tank-turret-color:#e22; --tank-radar-color:#faa;
              --body-rotation:0deg; --turret-rotation:90deg; --radar-rotation:90deg;"/>
  <use href="#tank" transform="translate(4960, 2960) scale(0.6)"
       style="--body-rotation:0deg; --turret-rotation:270deg; --radar-rotation:270deg;"/>

  <!-- Labels -->
  <text class="small" x="900" y="2450" fill="#F59E0B">wave now (turn 5)</text>
  <text class="text bold" x="4050" y="700" fill="#F59E0B" text-anchor="end">wave on arrival (turn 35)</text>
  <text class="text bold" x="1200" y="3950" fill="#D2691E" text-anchor="middle">enemy fired here</text>
  <text class="text bold" x="5100" y="1350" fill="#10B981">forward: danger 0.2</text>
  <text class="text bold" x="5250" y="4780" fill="#EF4444">reverse: danger 0.9</text>
  <text class="small" x="5250" y="4940" fill="#EF4444">brakes first, reaches less far</text>
  <text class="text bold" x="5620" y="3250" fill="#F59E0B">stop: danger 0.5</text>

  <!-- Tank defs block (copied from tank.svg) -->
  <defs>
    <style>
      .tank-body, .tank-turret, .tank-radar {
        transform-origin: 400px 400px;
      }
      .tank-body {
        transform: rotate(var(--body-rotation, 0deg));
      }
      .tank-turret {
        transform: rotate(var(--turret-rotation, 0deg));
      }
      .tank-radar {
        transform: rotate(var(--radar-rotation, 0deg));
      }
      svg {
        --tank-body-color: #019;
        --tank-turret-color: #06c;
        --tank-radar-color: #aaf;
        --left-belt-track-1: inline;
        --left-belt-track-2: none;
        --left-belt-track-3: none;
        --right-belt-track-1: none;
        --right-belt-track-2: inline;
        --right-belt-track-3: none;
      }
      .tank-body-fill {
        fill: var(--tank-body-color, #019);
      }
      .tank-turret-fill {
        fill: var(--tank-turret-color, #06c);
      }
      .tank-radar-fill {
        fill: var(--tank-radar-color, #aaf);
      }
      .left-belt, .right-belt {
        display: none;
      }
      .left-belt.track1 {
        display: var(--left-belt-track-1, none);
      }
      .left-belt.track2 {
        display: var(--left-belt-track-2, none);
      }
      .left-belt.track3 {
        display: var(--left-belt-track-3, none);
      }
      .right-belt.track1 {
        display: var(--right-belt-track-1, none);
      }
      .right-belt.track2 {
        display: var(--right-belt-track-2, none);
      }
      .right-belt.track3 {
        display: var(--right-belt-track-3, none);
      }
    </style>

    <linearGradient id="cannon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="50%" stop-color="#CCC"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>

    <symbol id="link0">
      <rect x="5" y="55" width="125" height="25" fill="#aaaaaa"/>
      <rect x="10" y="70" width="116" height="35" fill="#666666" rx="10" ry="10"/>
      <rect x="5" y="55" width="125" height="50" fill="none" stroke="black" stroke-width="10" rx="10" ry="10"/>
    </symbol>

    <symbol id="link30">
      <rect x="5" y="55" width="125" height="25" fill="#939393"/>
      <rect x="10" y="70" width="116" height="30" fill="#585858" rx="10" ry="10"/>
      <rect x="5" y="55" width="125" height="42" fill="none" stroke="black" stroke-width="10" rx="10" ry="10"/>
    </symbol>

    <symbol id="link60">
      <rect x="5" y="55" width="125" height="20" fill="#555555"/>
      <rect x="5" y="55" width="125" height="20" fill="none" stroke="black" stroke-width="10" rx="10" ry="10"/>
    </symbol>

    <symbol id="main-track">
      <rect x="20" y="75" width="95" height="450" fill="#333333" stroke="black" stroke-width="10"/>
    </symbol>

    <symbol id="track1">
      <use href="#main-track"/>
      <use href="#link30"/>
      <use href="#link0" y="60"/>
      <use href="#link0" y="140"/>
      <use href="#link0" y="220"/>
      <use href="#link0" y="300"/>
      <use href="#link0" y="380"/>
      <use href="#link30" y="448"/>
    </symbol>

    <symbol id="track2">
      <use href="#main-track"/>
      <use href="#link60"/>
      <use href="#link0" y="33"/>
      <use href="#link0" y="113"/>
      <use href="#link0" y="193"/>
      <use href="#link0" y="273"/>
      <use href="#link0" y="353"/>
      <use href="#link0" y="433"/>
    </symbol>

    <symbol id="track3">
      <use href="#main-track"/>
      <use href="#link0" y="7"/>
      <use href="#link0" y="87"/>
      <use href="#link0" y="167"/>
      <use href="#link0" y="247"/>
      <use href="#link0" y="327"/>
      <use href="#link0" y="407"/>
      <use href="#link60" y="470"/>
    </symbol>

    <symbol id="body">
      <use href="#track1" x="150" y="100" class="left-belt track1"/>
      <use href="#track2" x="150" y="100" class="left-belt track2"/>
      <use href="#track3" x="150" y="100" class="left-belt track3"/>
      <use href="#track1" x="515" y="100" class="right-belt track1"/>
      <use href="#track2" x="515" y="100" class="right-belt track2"/>
      <use href="#track3" x="515" y="100" class="right-belt track3"/>

      <rect class="tank-body-fill" x="240" y="190" width="320" height="420" stroke="black" stroke-width="20"
            rx="10" ry="10"/>
      <rect x="250" y="520" width="300" height="80" opacity="0.5"/>
    </symbol>

    <symbol id="turret">
      <rect class="tank-turret-fill" x="300" y="320" width="200" height="200" stroke="black" stroke-width="20"
            rx="10" ry="10"/>
      <rect x="310" y="460" width="180" height="50" fill="black" opacity="0.5"/>

      <rect x="360" y="240" width="80" height="80" fill="url(#cannon-grad)" stroke="black" stroke-width="20"/>
      <rect x="375" y="70" width="50" height="170" fill="url(#cannon-grad)" stroke="black" stroke-width="20"/>
    </symbol>

    <symbol id="radar">
      <circle class="tank-radar-fill" cx="400" cy="400" r="30" stroke="black" stroke-width="20"/>
      <path class="tank-radar-fill" d="M 290 420 q 110 100 220 0 z" stroke="black" stroke-width="20"/>
    </symbol>

    <symbol id="tank">
      <use class="tank-body" href="#body"/>
      <use class="tank-turret" href="#turret"/>
      <use class="tank-radar" href="#radar"/>
    </symbol>
  </defs>
</svg>
