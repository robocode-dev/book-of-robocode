<svg version="1.1" width="1000" height="500" viewBox="0 0 8000 4000"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Movement profiles with and without a flattener</title>
  <desc id="desc">Two schematic bar charts of time spent per GuessFactor, from GF -1 to GF +1. The left chart,
    surfing only, has two tall red peaks among shorter gray bars, which a gun that counts visits would aim at. The
    right chart, with flattener, has green bars of nearly equal height, so no angle stands out. Heights are
    illustrative.</desc>

  <style>
    .text { font: 150px sans-serif; }
    .small { font: 120px sans-serif; }
    .bold { font-weight: bold; }
  </style>

  <rect x="200" y="200" width="3600" height="3700" rx="60" fill="#1a1a2e"/>
  <text class="text bold" x="2000" y="560" fill="#D2691E" text-anchor="middle">surfing only</text>
  <rect x="417" y="2770" width="180" height="330" fill="#9CA3AF"/>
  <rect x="630" y="2660" width="180" height="440" fill="#9CA3AF"/>
  <rect x="843" y="2440" width="180" height="660" fill="#9CA3AF"/>
  <rect x="1057" y="1890" width="180" height="1210" fill="#9CA3AF"/>
  <rect x="1270" y="1120" width="180" height="1980" fill="#EF4444"/>
  <rect x="1483" y="1560" width="180" height="1540" fill="#EF4444"/>
  <rect x="1697" y="2330" width="180" height="770" fill="#9CA3AF"/>
  <rect x="1910" y="2660" width="180" height="440" fill="#9CA3AF"/>
  <rect x="2123" y="2550" width="180" height="550" fill="#9CA3AF"/>
  <rect x="2337" y="2220" width="180" height="880" fill="#9CA3AF"/>
  <rect x="2550" y="1450" width="180" height="1650" fill="#EF4444"/>
  <rect x="2763" y="900" width="180" height="2200" fill="#EF4444"/>
  <rect x="2977" y="1780" width="180" height="1320" fill="#9CA3AF"/>
  <rect x="3190" y="2440" width="180" height="660" fill="#9CA3AF"/>
  <rect x="3403" y="2770" width="180" height="330" fill="#9CA3AF"/>
  <line x1="400" y1="3100" x2="3600" y2="3100" stroke="#D2691E" stroke-width="16"/>
  <text class="small" x="400" y="3270" fill="#D2691E">GF -1</text>
  <text class="small" x="2000" y="3270" fill="#D2691E" text-anchor="middle">0</text>
  <text class="small" x="3600" y="3270" fill="#D2691E" text-anchor="end">GF +1</text>
  <text class="small" x="2000" y="3620" fill="#EF4444" text-anchor="middle">a visit-counting gun aims at the peaks</text>
  <rect x="4200" y="200" width="3600" height="3700" rx="60" fill="#1a1a2e"/>
  <text class="text bold" x="6000" y="560" fill="#D2691E" text-anchor="middle">with flattener</text>
  <rect x="4417" y="2110" width="180" height="990" fill="#10B981"/>
  <rect x="4630" y="2000" width="180" height="1100" fill="#10B981"/>
  <rect x="4843" y="1890" width="180" height="1210" fill="#10B981"/>
  <rect x="5057" y="2000" width="180" height="1100" fill="#10B981"/>
  <rect x="5270" y="1956" width="180" height="1144" fill="#10B981"/>
  <rect x="5483" y="2044" width="180" height="1056" fill="#10B981"/>
  <rect x="5697" y="2000" width="180" height="1100" fill="#10B981"/>
  <rect x="5910" y="2066" width="180" height="1034" fill="#10B981"/>
  <rect x="6123" y="2000" width="180" height="1100" fill="#10B981"/>
  <rect x="6337" y="1934" width="180" height="1166" fill="#10B981"/>
  <rect x="6550" y="2000" width="180" height="1100" fill="#10B981"/>
  <rect x="6763" y="2022" width="180" height="1078" fill="#10B981"/>
  <rect x="6977" y="1956" width="180" height="1144" fill="#10B981"/>
  <rect x="7190" y="2000" width="180" height="1100" fill="#10B981"/>
  <rect x="7403" y="2088" width="180" height="1012" fill="#10B981"/>
  <line x1="4400" y1="3100" x2="7600" y2="3100" stroke="#D2691E" stroke-width="16"/>
  <text class="small" x="4400" y="3270" fill="#D2691E">GF -1</text>
  <text class="small" x="6000" y="3270" fill="#D2691E" text-anchor="middle">0</text>
  <text class="small" x="7600" y="3270" fill="#D2691E" text-anchor="end">GF +1</text>
  <text class="small" x="6000" y="3620" fill="#10B981" text-anchor="middle">no angle stands out</text>
  <text class="small" x="120" y="1900" fill="#D2691E" text-anchor="middle"
        transform="rotate(-90 120 1900)">time spent</text>
</svg>
