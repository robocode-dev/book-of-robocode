<svg version="1.1" width="1000" height="625" viewBox="0 0 8000 5000"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A segmentation tree splits only where wave data supports it</title>
  <desc id="desc">Left panel: a rigid 4-by-3 grid over distance and lateral velocity. Most cells are hollow with a
  dashed gray outline and hold only a few samples, while a scattered few cells are filled green with denser data.
  Right panel: the same kind of state space, but divided by three boundary lines from a two-level binary split into
  four irregular rectangles, first split on distance, then each side split again on a different axis. All four leaf
  cells are filled the same solid green and each holds roughly the same number of samples, regardless of size.</desc>

  <style>
    .text { font: 150px sans-serif; }
    .small { font: 115px sans-serif; }
    .bold { font-weight: bold; }
  </style>

  <marker id="arrow-choc" markerWidth="20" markerHeight="20" refX="6" refY="3" orient="auto">
    <polygon points="6 0, 12 3, 6 6" fill="#D2691E"/>
  </marker>

  <!-- Background -->
  <rect x="0" y="0" width="8000" height="5000" fill="#1a1a2e"/>
  <rect x="300" y="500" width="3300" height="3700" fill="#2d3748" rx="40"/>
  <rect x="4300" y="500" width="3300" height="3700" fill="#2d3748" rx="40"/>

  <!-- Panel titles -->
  <text class="text bold" x="1950" y="640" fill="#D2691E" text-anchor="middle">fixed grid: many empty cells</text>
  <text class="text bold" x="5950" y="640" fill="#10B981" text-anchor="middle">adaptive tree: every leaf ~30 samples</text>

  <!-- Left panel axes -->
  <line x1="500" y1="3900" x2="3350" y2="3900" stroke="#D2691E" stroke-width="18" marker-end="url(#arrow-choc)"/>
  <line x1="500" y1="3900" x2="500" y2="650" stroke="#D2691E" stroke-width="18" marker-end="url(#arrow-choc)"/>
  <text class="text bold" x="1950" y="4300" fill="#D2691E" text-anchor="middle">distance</text>
  <text class="text bold" x="180" y="2300" fill="#D2691E" text-anchor="middle"
        transform="rotate(-90, 180, 2300)">lateral velocity</text>

  <!-- Left panel: fixed grid, mostly hollow cells -->
  <g stroke="#9CA3AF" stroke-width="12" stroke-dasharray="40 30" fill="none">
    <rect x="500" y="700" width="725" height="1067"/>
    <rect x="1950" y="700" width="725" height="1067"/>
    <rect x="2675" y="700" width="725" height="1067"/>
    <rect x="500" y="1767" width="725" height="1067"/>
    <rect x="1225" y="1767" width="725" height="1067"/>
    <rect x="1950" y="1767" width="725" height="1067"/>
    <rect x="1225" y="2834" width="725" height="1066"/>
    <rect x="2675" y="2834" width="725" height="1066"/>
  </g>
  <g fill="#10B981" fill-opacity="0.55" stroke="#065F46" stroke-width="18">
    <rect x="1225" y="700" width="725" height="1067"/>
    <rect x="2675" y="1767" width="725" height="1067"/>
    <rect x="500" y="2834" width="725" height="1066"/>
    <rect x="1950" y="2834" width="725" height="1066"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="862" y="1260" fill="#9CA3AF">2</text>
    <text x="1587" y="1260" fill="#F7FAFC">35</text>
    <text x="2312" y="1260" fill="#9CA3AF">3</text>
    <text x="3037" y="1260" fill="#9CA3AF">4</text>
    <text x="862" y="2327" fill="#9CA3AF">1</text>
    <text x="1587" y="2327" fill="#9CA3AF">3</text>
    <text x="2312" y="2327" fill="#9CA3AF">2</text>
    <text x="3037" y="2327" fill="#F7FAFC">28</text>
    <text x="862" y="3394" fill="#F7FAFC">22</text>
    <text x="1587" y="3394" fill="#9CA3AF">4</text>
    <text x="2312" y="3394" fill="#F7FAFC">31</text>
    <text x="3037" y="3394" fill="#9CA3AF">3</text>
  </g>

  <!-- Right panel axes -->
  <line x1="4500" y1="3900" x2="7350" y2="3900" stroke="#D2691E" stroke-width="18" marker-end="url(#arrow-choc)"/>
  <line x1="4500" y1="3900" x2="4500" y2="650" stroke="#D2691E" stroke-width="18" marker-end="url(#arrow-choc)"/>
  <text class="text bold" x="5950" y="4300" fill="#D2691E" text-anchor="middle">distance</text>
  <text class="text bold" x="4180" y="2300" fill="#D2691E" text-anchor="middle"
        transform="rotate(-90, 4180, 2300)">lateral velocity</text>

  <!-- Right panel: adaptive tree partition, four green leaves -->
  <g fill="#10B981" fill-opacity="0.55" stroke="#065F46" stroke-width="20">
    <rect x="4500" y="700" width="1305" height="1600"/>
    <rect x="4500" y="2300" width="1305" height="1600"/>
    <rect x="5805" y="700" width="1595" height="1000"/>
    <rect x="5805" y="1700" width="1595" height="2200"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="5152" y="1540" fill="#F7FAFC">28</text>
    <text x="5152" y="3140" fill="#F7FAFC">32</text>
    <text x="6602" y="1240" fill="#F7FAFC">29</text>
    <text x="6602" y="2840" fill="#F7FAFC">31</text>
  </g>

  <!-- Split boundaries -->
  <line x1="5805" y1="700" x2="5805" y2="3900" stroke="#D2691E" stroke-width="22"/>
  <line x1="4500" y1="2300" x2="5805" y2="2300" stroke="#D2691E" stroke-width="22"/>
  <line x1="5805" y1="1700" x2="7400" y2="1700" stroke="#D2691E" stroke-width="22"/>

  <!-- Split labels with short pointer arrows -->
  <line x1="5805" y1="900" x2="6150" y2="800" stroke="#D2691E" stroke-width="10" marker-end="url(#arrow-choc)"/>
  <text class="small" x="6180" y="820" fill="#D2691E">split on distance</text>

  <line x1="4900" y1="2300" x2="4900" y2="2020" stroke="#D2691E" stroke-width="10" marker-end="url(#arrow-choc)"/>
  <text class="small" x="4520" y="1970" fill="#D2691E">split on lateral velocity</text>

  <line x1="7000" y1="1700" x2="7000" y2="1450" stroke="#D2691E" stroke-width="10" marker-end="url(#arrow-choc)"/>
  <text class="small" x="6560" y="1400" fill="#D2691E">split on wall distance</text>

  <!-- Tank defs block (copied from tank.svg) -->
  <defs>
    <style>
      .tank-body, .tank-turret, .tank-radar {
      transform-origin: 400px 400px;
      }
      .tank-body {
      transform: rotate(var(--body-rotation, 0deg));
      }
      .tank-turret {
      transform: rotate(var(--turret-rotation, 0deg));
      }
      .tank-radar {
      transform: rotate(var(--radar-rotation, 0deg));
      }
      svg {
      --tank-body-color: #019;
      --tank-turret-color: #06c;
      --tank-radar-color: #aaf;
      --left-belt-track-1: inline;
      --left-belt-track-2: none;
      --left-belt-track-3: none;
      --right-belt-track-1: none;
      --right-belt-track-2: inline;
      --right-belt-track-3: none;
      }
      .tank-body-fill {
      fill: var(--tank-body-color, #019);
      }
      .tank-turret-fill {
      fill: var(--tank-turret-color, #06c);
      }
      .tank-radar-fill {
      fill: var(--tank-radar-color, #aaf);
      }
      .left-belt, .right-belt {
      display: none;
      }
      .left-belt.track1 {
      display: var(--left-belt-track-1, none);
      }
      .left-belt.track2 {
      display: var(--left-belt-track-2, none);
      }
      .left-belt.track3 {
      display: var(--left-belt-track-3, none);
      }
      .right-belt.track1 {
      display: var(--right-belt-track-1, none);
      }
      .right-belt.track2 {
      display: var(--right-belt-track-2, none);
      }
      .right-belt.track3 {
      display: var(--right-belt-track-3, none);
      }
    </style>

    <linearGradient id="cannon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="50%" stop-color="#CCC"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>

    <symbol id="link0">
      <rect x="5" y="55" width="125" height="25" fill="#aaaaaa"/>
      <rect x="10" y="70" width="116" height="35" fill="#666666" rx="10" ry="10"/>
      <rect x="5" y="55" width="125" height="50" fill="none" stroke="black" stroke-width="10" rx="10" ry="10"/>
    </symbol>

    <symbol id="link30">
      <rect x="5" y="55" width="125" height="25" fill="#939393"/>
      <rect x="10" y="70" width="116" height="30" fill="#585858" rx="10" ry="10"/>
      <rect x="5" y="55" width="125" height="42" fill="none" stroke="black" stroke-width="10" rx="10" ry="10"/>
    </symbol>

    <symbol id="link60">
      <rect x="5" y="55" width="125" height="20" fill="#555555"/>
      <rect x="5" y="55" width="125" height="20" fill="none" stroke="black" stroke-width="10" rx="10" ry="10"/>
    </symbol>

    <symbol id="main-track">
      <rect x="20" y="75" width="95" height="450" fill="#333333" stroke="black" stroke-width="10"/>
    </symbol>

    <symbol id="track1">
      <use href="#main-track"/>
      <use href="#link30"/>
      <use href="#link0" y="60"/>
      <use href="#link0" y="140"/>
      <use href="#link0" y="220"/>
      <use href="#link0" y="300"/>
      <use href="#link0" y="380"/>
      <use href="#link30" y="448"/>
    </symbol>

    <symbol id="track2">
      <use href="#main-track"/>
      <use href="#link60"/>
      <use href="#link0" y="33"/>
      <use href="#link0" y="113"/>
      <use href="#link0" y="193"/>
      <use href="#link0" y="273"/>
      <use href="#link0" y="353"/>
      <use href="#link0" y="433"/>
    </symbol>

    <symbol id="track3">
      <use href="#main-track"/>
      <use href="#link0" y="7"/>
      <use href="#link0" y="87"/>
      <use href="#link0" y="167"/>
      <use href="#link0" y="247"/>
      <use href="#link0" y="327"/>
      <use href="#link0" y="407"/>
      <use href="#link60" y="470"/>
    </symbol>

    <symbol id="body">
      <use href="#track1" x="150" y="100" class="left-belt track1"/>
      <use href="#track2" x="150" y="100" class="left-belt track2"/>
      <use href="#track3" x="150" y="100" class="left-belt track3"/>
      <use href="#track1" x="515" y="100" class="right-belt track1"/>
      <use href="#track2" x="515" y="100" class="right-belt track2"/>
      <use href="#track3" x="515" y="100" class="right-belt track3"/>

      <rect class="tank-body-fill" x="240" y="190" width="320" height="420" stroke="black" stroke-width="20"
            rx="10" ry="10"/>
      <rect x="250" y="520" width="300" height="80" opacity="0.5"/>
    </symbol>

    <symbol id="turret">
      <rect class="tank-turret-fill" x="300" y="320" width="200" height="200" stroke="black" stroke-width="20"
            rx="10" ry="10"/>
      <rect x="310" y="460" width="180" height="50" fill="black" opacity="0.5"/>

      <rect x="360" y="240" width="80" height="80" fill="url(#cannon-grad)" stroke="black" stroke-width="20"/>
      <rect x="375" y="70" width="50" height="170" fill="url(#cannon-grad)" stroke="black" stroke-width="20"/>
    </symbol>

    <symbol id="radar">
      <circle class="tank-radar-fill" cx="400" cy="400" r="30" stroke="black" stroke-width="20"/>
      <path class="tank-radar-fill" d="M 290 420 q 110 100 220 0 z" stroke="black" stroke-width="20"/>
    </symbol>

    <symbol id="tank">
      <use class="tank-body" href="#body"/>
      <use class="tank-turret" href="#turret"/>
      <use class="tank-radar" href="#radar"/>
    </symbol>
  </defs>
</svg>
