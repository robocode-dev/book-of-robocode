<svg version="1.1" width="1000" height="625" viewBox="0 0 8000 5000"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A real bullet wave and a virtual wave</title>
  <desc id="desc">A blue bot fires a real bullet. Its solid orange wave is about to reach a red wave-surfing bot, which reverses along a green path away from the gray spot the old data predicted. A dashed gray virtual wave from a turn without a shot carries no bullet, so the surfer does not react to it and its outcome gets a lower weight.</desc>

  <style>
    .text { font: 150px sans-serif; }
    .small { font: 120px sans-serif; }
    .bold { font-weight: bold; }
  </style>

  <!-- Arrow markers -->
    <marker id="arrow-green" markerWidth="20" markerHeight="20" refX="6" refY="3" orient="auto">
      <polygon points="6 0, 12 3, 6 6" fill="#10B981"/>
    </marker>
    <marker id="arrow-grey" markerWidth="20" markerHeight="20" refX="6" refY="3" orient="auto">
      <polygon points="6 0, 12 3, 6 6" fill="#9CA3AF"/>
    </marker>
    <marker id="arrow-orange" markerWidth="20" markerHeight="20" refX="6" refY="3" orient="auto">
      <polygon points="6 0, 12 3, 6 6" fill="#F59E0B"/>
    </marker>

  <!-- Battlefield background -->
  <rect x="0" y="0" width="8000" height="5000" fill="grey"/>
  <rect x="200" y="200" width="7600" height="4600" fill="#111"/>
  <clipPath id="field"><rect x="200" y="200" width="7600" height="4600"/></clipPath>

  <g clip-path="url(#field)">
    <!-- Virtual wave: no bullet, so the surfer never sees it -->
    <path d="M 2455 1351 A 2500 2500 0 0 1 4062 4134" stroke="#9CA3AF" stroke-width="30" stroke-dasharray="120 80"
          fill="none"/>
    <!-- Real bullet wave: announced by the energy drop -->
    <path d="M 3642 -141 A 4350 4350 0 0 1 5855 4604" stroke="#F59E0B" stroke-width="60" fill="none"/>
    <!-- Aim line of the real bullet -->
    <line x1="1600" y1="3700" x2="5367" y2="1525" stroke="#F59E0B" stroke-width="16"
          stroke-dasharray="60 60" opacity="0.6"/>
  </g>

  <!-- Bullet riding the real wave -->
  <circle cx="5367" cy="1525" r="70" fill="#F59E0B" stroke="#FDE68A" stroke-width="20"/>

  <!-- Where the old data expected the surfer (gray) and the dodge (green) -->
  <path d="M 6143 1864 Q 6100 1407 5778 1140" stroke="#9CA3AF"
        stroke-width="30" stroke-dasharray="80 60" fill="none" marker-end="url(#arrow-grey)"/>
  <circle cx="5663" cy="855" r="170" fill="none" stroke="#9CA3AF" stroke-width="20"
          stroke-dasharray="40 40"/>
  <path d="M 6143 1864 Q 6550 2280 6565 2780"
        stroke="#10B981" stroke-width="40" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Bots -->
  <!-- Friendly bot (fires the real bullet) -->
  <use href="#tank" transform="translate(1300, 3400) scale(0.75)"
       style="--body-rotation:40deg; --turret-rotation:60deg; --radar-rotation:60deg;"/>
  <!-- Enemy surfer -->
  <use href="#tank" transform="translate(5843, 1564) scale(0.75)"
       style="--tank-body-color:#c00; --tank-turret-color:#e22; --tank-radar-color:#faa; --body-rotation:158deg; --turret-rotation:248deg; --radar-rotation:248deg;"/>

  <!-- Text labels -->
  <text class="text bold" x="6046" y="4287" fill="#F59E0B">real bullet wave</text>
  <text class="small" x="6046" y="4447" fill="#F59E0B">bullet fired: high weight</text>
  <text class="text bold" x="4195" y="3195" fill="#9CA3AF">virtual wave</text>
  <text class="small" x="4195" y="3355" fill="#9CA3AF">no bullet: low weight</text>
  <text class="text bold" x="6950" y="3260" fill="#D2691E"
        text-anchor="middle">surfer reacts here</text>
  <text class="small" x="6950" y="3420" fill="#10B981"
        text-anchor="middle">dodges the real wave</text>
  <text class="small" x="5813" y="615" fill="#9CA3AF"
        text-anchor="middle">old data predicted here</text>
  <text class="small" x="1600" y="4220" fill="#60A5FA" text-anchor="middle">fires: energy drops</text>

  <!-- Tank defs block (copied from tank.svg) -->
    <defs>
            <style>
                .tank-body, .tank-turret, .tank-radar {
                transform-origin: 400px 400px;
                }
                .tank-body {
                transform: rotate(var(--body-rotation, 0deg));
                }
                .tank-turret {
                transform: rotate(var(--turret-rotation, 0deg));
                }
                .tank-radar {
                transform: rotate(var(--radar-rotation, 0deg));
                }
                svg {
                --tank-body-color: #019;
                --tank-turret-color: #06c;
                --tank-radar-color: #aaf;
                --left-belt-track-1: inline;
                --left-belt-track-2: none;
                --left-belt-track-3: none;
                --right-belt-track-1: none;
                --right-belt-track-2: inline;
                --right-belt-track-3: none;
                }
                .tank-body-fill {
                fill: var(--tank-body-color, #019);
                }
                .tank-turret-fill {
                fill: var(--tank-turret-color, #06c);
                }
                .tank-radar-fill {
                fill: var(--tank-radar-color, #aaf);
                }
                .left-belt, .right-belt {
                display: none;
                }
                .left-belt.track1 {
                display: var(--left-belt-track-1, none);
                }
                .left-belt.track2 {
                display: var(--left-belt-track-2, none);
                }
                .left-belt.track3 {
                display: var(--left-belt-track-3, none);
                }
                .right-belt.track1 {
                display: var(--right-belt-track-1, none);
                }
                .right-belt.track2 {
                display: var(--right-belt-track-2, none);
                }
                .right-belt.track3 {
                display: var(--right-belt-track-3, none);
                }
            </style>

            <linearGradient id="cannon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#333"/>
                <stop offset="50%" stop-color="#CCC"/>
                <stop offset="100%" stop-color="#333"/>
            </linearGradient>

            <symbol id="link0">
                <rect x="5" y="55" width="125" height="25" fill="#aaaaaa"/>
                <rect x="10" y="70" width="116" height="35" fill="#666666" rx="10" ry="10"/>
                <rect x="5" y="55" width="125" height="50" fill="none" stroke="black" stroke-width="10" rx="10" ry="10"/>
            </symbol>

            <symbol id="link30">
                <rect x="5" y="55" width="125" height="25" fill="#939393"/>
                <rect x="10" y="70" width="116" height="30" fill="#585858" rx="10" ry="10"/>
                <rect x="5" y="55" width="125" height="42" fill="none" stroke="black" stroke-width="10" rx="10" ry="10"/>
            </symbol>

            <symbol id="link60">
                <rect x="5" y="55" width="125" height="20" fill="#555555"/>
                <rect x="5" y="55" width="125" height="20" fill="none" stroke="black" stroke-width="10" rx="10" ry="10"/>
            </symbol>

            <symbol id="main-track">
                <rect x="20" y="75" width="95" height="450" fill="#333333" stroke="black" stroke-width="10"/>
            </symbol>

            <symbol id="track1">
                <use href="#main-track"/>
                <use href="#link30"/>
                <use href="#link0" y="60"/>
                <use href="#link0" y="140"/>
                <use href="#link0" y="220"/>
                <use href="#link0" y="300"/>
                <use href="#link0" y="380"/>
                <use href="#link30" y="448"/>
            </symbol>

            <symbol id="track2">
                <use href="#main-track"/>
                <use href="#link60"/>
                <use href="#link0" y="33"/>
                <use href="#link0" y="113"/>
                <use href="#link0" y="193"/>
                <use href="#link0" y="273"/>
                <use href="#link0" y="353"/>
                <use href="#link0" y="433"/>
            </symbol>

            <symbol id="track3">
                <use href="#main-track"/>
                <use href="#link0" y="7"/>
                <use href="#link0" y="87"/>
                <use href="#link0" y="167"/>
                <use href="#link0" y="247"/>
                <use href="#link0" y="327"/>
                <use href="#link0" y="407"/>
                <use href="#link60" y="470"/>
            </symbol>

            <symbol id="body">
                <use href="#track1" x="150" y="100" class="left-belt track1"/>
                <use href="#track2" x="150" y="100" class="left-belt track2"/>
                <use href="#track3" x="150" y="100" class="left-belt track3"/>
                <use href="#track1" x="515" y="100" class="right-belt track1"/>
                <use href="#track2" x="515" y="100" class="right-belt track2"/>
                <use href="#track3" x="515" y="100" class="right-belt track3"/>

                <rect class="tank-body-fill" x="240" y="190" width="320" height="420" stroke="black" stroke-width="20"
                      rx="10" ry="10"/>
                <rect x="250" y="520" width="300" height="80" opacity="0.5"/>
            </symbol>

            <symbol id="turret">
                <rect class="tank-turret-fill" x="300" y="320" width="200" height="200" stroke="black" stroke-width="20"
                      rx="10" ry="10"/>
                <rect x="310" y="460" width="180" height="50" fill="black" opacity="0.5"/>

                <rect x="360" y="240" width="80" height="80" fill="url(#cannon-grad)" stroke="black" stroke-width="20"/>
                <rect x="375" y="70" width="50" height="170" fill="url(#cannon-grad)" stroke="black" stroke-width="20"/>
            </symbol>

            <symbol id="radar">
                <circle class="tank-radar-fill" cx="400" cy="400" r="30" stroke="black" stroke-width="20"/>
                <path class="tank-radar-fill" d="M 290 420 q 110 100 220 0 z" stroke="black" stroke-width="20"/>
            </symbol>

            <symbol id="tank">
                <use class="tank-body" href="#body"/>
                <use class="tank-turret" href="#turret"/>
                <use class="tank-radar" href="#radar"/>
            </symbol>
        </defs>
</svg>
